name: Hello GitHub Actions

on:
  push:
    branches:
      - main

jobs:

  hello:

    runs-on: ubuntu-latest

    steps:

      - name: Print message
        run: echo "Hello Abhishek"

      - name: Check Linux
        run: uname -a

      - name: Check current directory
        run: pwd

      - name: List files
        run: ls -la
